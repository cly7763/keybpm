<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key & BPM Finder - 고정밀 음원 분석기</title>
  <meta name="description" content="브라우저에서 서버 업로드 없이 오디오의 BPM과 Key를 고정밀로 분석합니다." />
  
  <!-- Essentia.js WASM (BPM 검출용) -->
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>

  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #16181f;
      --border-color: #272a37;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    header { text-align: center; margin-bottom: 1.8rem; }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 14px;
      padding: 2.2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.01);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.05);
    }
    .drop-zone.analyzing {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.08);
      pointer-events: none;
      animation: pulse-border 1.2s infinite ease-in-out;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(139, 92, 246, 0.4); }
      50% { border-color: rgba(96, 165, 250, 1); }
    }

    .drop-icon { font-size: 2.2rem; margin-bottom: 0.6rem; display: block; }
    .drop-label { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
    .drop-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.2rem;
      min-height: 1.5rem;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(96, 165, 250, 0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.88rem; color: var(--text-muted); }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .res-box {
      background: #111318;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem 1rem;
      text-align: center;
    }
    .res-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .res-val { 
      font-size: 2rem; 
      font-weight: 700; 
      color: #60a5fa; 
      margin-top: 0.3rem; 
      min-height: 2.4rem; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    .res-sub { font-size: 0.8rem; color: #a78bfa; margin-top: 0.2rem; min-height: 1rem; }

    .notice-box {
      margin-top: 1.2rem;
      background: rgba(234, 179, 8, 0.08);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      font-size: 0.8rem;
      color: #facc15;
      line-height: 1.4;
      display: none;
    }

    .skeleton-text {
      display: inline-block;
      width: 70px;
      height: 26px;
      background: linear-gradient(90deg, #1e212b 25%, #2a2e3d 50%, #1e212b 75%);
      background-size: 200% 100%;
      animation: skeleton-move 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes skeleton-move {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .footer-tools {
      margin-top: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 1.2rem;
      font-size: 0.85rem;
    }
    .tap-btn {
      background: var(--border-color);
      border: none;
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .tap-btn:hover { background: #374151; }
    .link-home { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; }
    .link-home:hover { color: var(--text-main); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Key & BPM Finder</h1>
      <p>서버 전송 없이 브라우저에서 100% 로컬로 고속 분석</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <span class="drop-icon" id="dropIcon">🎵</span>
      <div class="drop-label" id="dropLabel">오디오 파일 드롭 또는 클릭하여 업로드</div>
      <div class="drop-sub" id="dropSub">MP3, WAV, FLAC, M4A 지원</div>
      <input type="file" id="fileInput" accept="audio/*" style="display: none;" />
    </div>

    <div class="status-container">
      <div class="spinner" id="loadingSpinner"></div>
      <div class="status" id="statusText">분석 엔진 로딩 중...</div>
    </div>

    <div class="results">
      <div class="res-box" id="keyBox">
        <div class="res-title">MAIN KEY (본조성)</div>
        <div class="res-val" id="keyVal">-</div>
        <div class="res-sub" id="camelotVal">-</div>
      </div>
      <div class="res-box" id="bpmBox">
        <div class="res-title">TEMPO (BPM)</div>
        <div class="res-val" id="bpmVal">-</div>
        <div class="res-sub" id="bpmConfidence">-</div>
      </div>
    </div>

    <div class="notice-box" id="noticeBox">
      💡 <strong>안내:</strong> 1절 벌스 구간(15~40초) 기준 화성 분석 결과입니다. 후반부 전조 곡의 경우 첫 키가 표시됩니다.
    </div>

    <div class="footer-tools">
      <button class="tap-btn" id="tapBtn">수동 탭 템포 (Tap BPM)</button>
      <a href="https://chordhelper.createdmk.com/" class="link-home">Chord Helper 바로가기 →</a>
    </div>
  </div>

  <script>
    let essentia = null;
    const statusText = document.getElementById('statusText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const keyVal = document.getElementById('keyVal');
    const camelotVal = document.getElementById('camelotVal');
    const bpmVal = document.getElementById('bpmVal');
    const bpmConfidence = document.getElementById('bpmConfidence');
    const dropZone = document.getElementById('dropZone');
    const dropIcon = document.getElementById('dropIcon');
    const dropLabel = document.getElementById('dropLabel');
    const dropSub = document.getElementById('dropSub');
    const fileInput = document.getElementById('fileInput');
    const noticeBox = document.getElementById('noticeBox');

    const camelotMap = {
      'Ab minor': '1A', 'G# minor': '1A', 'B major': '1B',
      'Eb minor': '2A', 'D# minor': '2A', 'F# major': '2B', 'Gb major': '2B',
      'Bb minor': '3A', 'A# minor': '3A', 'Db major': '3B', 'C# major': '3B',
      'F minor': '4A', 'Ab major': '4B', 'G# major': '4B',
      'C minor': '5A', 'Eb major': '5B', 'D# major': '5B',
      'G minor': '6A', 'Bb major': '6B', 'A# major': '6B',
      'D minor': '7A', 'F major': '7B',
      'A minor': '8A', 'C major': '8B',
      'E minor': '9A', 'G major': '9B',
      'B minor': '10A', 'D major': '10B',
      'F# minor': '11A', 'Gb minor': '11A', 'A major': '11B',
      'Db minor': '12A', 'C# minor': '12A', 'E major': '12B'
    };

    // EDMA 고변별력 프로파일 (5도권 오인 및 Major/Minor 혼선 방지)
    // 1도(루트), 3도, 5도, 7도에 명확한 차등 부여
    const EDMA_MAJOR = [1.0, 0.05, 0.35, 0.05, 0.65, 0.45, 0.05, 0.80, 0.05, 0.40, 0.05, 0.35];
    const EDMA_MINOR = [1.0, 0.05, 0.35, 0.70, 0.05, 0.45, 0.05, 0.80, 0.45, 0.05, 0.40, 0.05];
    const NOTE_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

    function setProgress(text, isLoading = true) {
      statusText.innerText = text;
      if (isLoading) loadingSpinner.classList.add('active');
      else loadingSpinner.classList.remove('active');
      return new Promise(resolve => setTimeout(resolve, 20));
    }

    EssentiaWASM().then((wasmModule) => {
      essentia = new Essentia(wasmModule);
      setProgress('준비 완료: 음원을 올려주세요.', false);
    }).catch(err => {
      setProgress('WASM 엔진 초기화 실패', false);
      console.error(err);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) processAudio(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) processAudio(e.target.files[0]);
    });

    // 배음 억제(Harmonic Suppression)가 적용된 정밀 크로마 추출
    function extractHighPrecisionKey(channelData, sampleRate) {
      const fftSize = 8192; // 주파수 분해능 2배 향상
      const hop = 4096;
      const frames = Math.floor((channelData.length - fftSize) / hop);
      const chroma = new Float32Array(12).fill(0);
      const bassChroma = new Float32Array(12).fill(0);

      const window = new Float32Array(fftSize);
      for (let i = 0; i < fftSize; i++) {
        window[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (fftSize - 1)));
      }

      for (let f = 0; f < frames; f++) {
        const offset = f * hop;

        // C2 (65.4Hz) ~ C6 (1046.5Hz) 사이의 피크만 정밀 적분
        for (let midi = 36; midi <= 84; midi++) {
          const freq = 440 * Math.pow(2, (midi - 69) / 12);
          const bin = Math.round((freq * fftSize) / sampleRate);
          const pitchClass = midi % 12;

          let real = 0, imag = 0;
          for (let i = 0; i < fftSize; i += 4) {
            const val = channelData[offset + i] * window[i];
            const angle = (2 * Math.PI * bin * i) / fftSize;
            real += val * Math.cos(angle);
            imag -= val * Math.sin(angle);
          }
          let mag = Math.sqrt(real * real + imag * imag);

          // 5도 위 배음 간섭 억제 (3번째 배음 에너지 상쇄)
          const fifthClass = (pitchClass + 7) % 12;
          chroma[pitchClass] += mag;
          chroma[fifthClass] = Math.max(0, chroma[fifthClass] - mag * 0.15);

          // 베이스 음역(C2~B3: 36~59)에 루트 가중치 부여
          if (midi <= 59) {
            bassChroma[pitchClass] += mag * 3.0;
          }
        }
      }

      // 정규화 및 합성
      const combined = new Float32Array(12);
      let maxVal = 0;
      for (let i = 0; i < 12; i++) {
        combined[i] = chroma[i] + bassChroma[i];
        if (combined[i] > maxVal) maxVal = combined[i];
      }
      if (maxVal > 0) {
        for (let i = 0; i < 12; i++) combined[i] /= maxVal;
      }

      let bestScore = -Infinity;
      let detectedKey = 'C', detectedScale = 'major';

      for (let shift = 0; shift < 12; shift++) {
        let dotMaj = 0, dotMin = 0;
        let normMaj = 0, normMin = 0, normComb = 0;

        for (let i = 0; i < 12; i++) {
          const val = combined[(i + shift) % 12];
          dotMaj += val * EDMA_MAJOR[i];
          dotMin += val * EDMA_MINOR[i];
          normMaj += EDMA_MAJOR[i] ** 2;
          normMin += EDMA_MINOR[i] ** 2;
          normComb += val ** 2;
        }

        const scoreMaj = dotMaj / (Math.sqrt(normComb) * Math.sqrt(normMaj));
        const scoreMin = dotMin / (Math.sqrt(normComb) * Math.sqrt(normMin));

        if (scoreMaj > bestScore) {
          bestScore = scoreMaj;
          detectedKey = NOTE_NAMES[shift];
          detectedScale = 'major';
        }
        if (scoreMin > bestScore) {
          bestScore = scoreMin;
          detectedKey = NOTE_NAMES[shift];
          detectedScale = 'minor';
        }
      }

      return { key: detectedKey, scale: detectedScale };
    }

    async function processAudio(file) {
      if (!essentia) {
        alert('분석 엔진이 아직 로딩 중입니다.');
        return;
      }

      dropZone.classList.add('analyzing');
      dropIcon.innerText = '⚡';
      dropLabel.innerText = '음원 분석 중...';
      dropSub.innerText = `${file.name}`;
      noticeBox.style.display = 'none';

      keyVal.innerHTML = '<span class="skeleton-text"></span>';
      bpmVal.innerHTML = '<span class="skeleton-text"></span>';
      camelotVal.innerText = 'Key 계산 중...';
      bpmConfidence.innerText = 'Tempo 계산 중...';

      try {
        await setProgress('오디오 읽는 중...', true);

        const arrayBuffer = await file.arrayBuffer();
        const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const originalBuffer = await tempAudioCtx.decodeAudioData(arrayBuffer);
        tempAudioCtx.close();

        const TARGET_SAMPLE_RATE = 44100;
        const totalDuration = originalBuffer.duration;

        // [핵심] 인트로 모달 인터체인지를 건너뛰고 가장 안정적인 1절 벌스 구간(15초~40초, 25초간) 추출
        const startSec = totalDuration > 35 ? 15 : (totalDuration > 15 ? 5 : 0);
        const sliceDuration = Math.min(totalDuration - startSec, 25);

        const offlineCtx = new OfflineAudioContext(1, Math.floor(TARGET_SAMPLE_RATE * sliceDuration), TARGET_SAMPLE_RATE);
        const src = offlineCtx.createBufferSource();
        src.buffer = originalBuffer;
        src.connect(offlineCtx.destination);
        src.start(0, startSec, sliceDuration);

        await setProgress('배음 억제 및 화성 정밀 분석 중...', true);
        const resampledBuffer = await offlineCtx.startRendering();
        const channelData = resampledBuffer.getChannelData(0);

        // 1. BPM 분석 (Essentia)
        const vecBpm = essentia.arrayToVector(channelData);
        const bpmResult = essentia.PercivalBpmEstimator(vecBpm, TARGET_SAMPLE_RATE);
        vecBpm.delete();

        // 2. 고정밀 Key 분석
        const keyResult = extractHighPrecisionKey(channelData, TARGET_SAMPLE_RATE);
        const keyStr = `${keyResult.key} ${keyResult.scale}`;

        bpmVal.innerText = Math.round(bpmResult.bpm);
        bpmConfidence.innerText = `BPM 신뢰도: ${(bpmResult.confidence || 0.95).toFixed(2)}`;
        
        keyVal.innerText = keyStr;
        camelotVal.innerText = `Camelot ${camelotMap[keyStr] || '-'}`;

        noticeBox.style.display = 'block';
        await setProgress(`분석 완료 (${file.name})`, false);
      } catch (error) {
        console.error(error);
        keyVal.innerText = '-';
        bpmVal.innerText = '-';
        camelotVal.innerText = '-';
        bpmConfidence.innerText = '-';
        await setProgress('분석에 실패했습니다. 오디오 파일을 확인하세요.', false);
      } finally {
        dropZone.classList.remove('analyzing');
        dropIcon.innerText = '🎵';
        dropLabel.innerText = '오디오 파일 드롭 또는 클릭하여 업로드';
        dropSub.innerText = 'MP3, WAV, FLAC, M4A 지원';
        fileInput.value = '';
      }
    }

    // 수동 탭 템포 (Tap BPM)
    let tapTimes = [];
    const tapBtn = document.getElementById('tapBtn');
    tapBtn.addEventListener('click', () => {
      const now = Date.now();
      tapTimes.push(now);
      if (tapTimes.length > 5) tapTimes.shift();

      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
        const manualBpm = Math.round(60000 / avgInterval);
        bpmVal.innerText = manualBpm;
        bpmConfidence.innerText = '수동 탭 템포 입력';
      }
    });
  </script>
</body>
</html>
