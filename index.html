<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Key & BPM Finder - Free Online Audio Key & BPM Detector</title>
  <meta name="description" content="Detect BPM, Key, and Camelot code of any audio file (MP3, WAV) locally in your browser. 100% free and fast with no file upload to servers." />
  <link rel="canonical" href="https://keyandbpm.createdmk.com/" />

  <!-- Essentia.js WASM & Core -->
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --card-inner: #0b1120;
      --border-color: #1e293b;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.75rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem 1.25rem;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .top-header-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.5rem;
    }

    .lang-switcher {
      display: inline-flex;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--accent-blue);
      color: #0b0f19;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.35;
      word-break: keep-all;
      padding: 0 0.5rem;
    }

    .drop-zone {
      display: block;
      border: 1.5px dashed #334155;
      border-radius: 14px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.01);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.04);
    }
    .drop-zone.analyzing {
      border-color: var(--accent-purple);
      background: rgba(129, 140, 248, 0.08);
      pointer-events: none;
      animation: pulse-border 1.2s infinite ease-in-out;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(129, 140, 248, 0.3); }
      50% { border-color: rgba(56, 189, 248, 0.9); }
    }

    .drop-icon { font-size: 1.8rem; margin-bottom: 0.4rem; display: block; }
    .drop-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
      word-break: keep-all;
    }
    .drop-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.85rem;
      min-height: 1.4rem;
      text-align: center;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: keep-all;
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .res-box {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.9rem 0.6rem;
      text-align: center;
    }
    .res-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      word-break: keep-all;
    }
    .res-val { 
      font-size: 1.6rem; 
      font-weight: 800; 
      color: var(--accent-blue); 
      margin-top: 0.2rem; 
      min-height: 2rem; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      word-break: keep-all;
    }
    .res-sub {
      font-size: 0.75rem;
      color: #a78bfa;
      margin-top: 0.15rem;
      min-height: 0.9rem;
    }

    .notice-box {
      margin-top: 0.9rem;
      background: rgba(234, 179, 8, 0.06);
      border: 1px solid rgba(234, 179, 8, 0.2);
      border-radius: 10px;
      padding: 0.65rem 0.8rem;
      font-size: 0.75rem;
      color: #facc15;
      line-height: 1.35;
      word-break: keep-all;
      display: none;
    }

    .skeleton-text {
      display: inline-block;
      width: 50px;
      height: 22px;
      background: linear-gradient(90deg, #131b2e 25%, #1e293b 50%, #131b2e 75%);
      background-size: 200% 100%;
      animation: skeleton-move 1.4s infinite;
      border-radius: 4px;
    }
    @keyframes skeleton-move {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .footer-tools {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
    }
    .tap-btn {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.55rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
      transition: all 0.2s;
    }
    .tap-btn:active {
      transform: scale(0.97);
      background: #1e293b;
    }
    .link-home {
      flex: 1;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
      padding: 0.55rem 0.2rem;
      border-radius: 8px;
    }
    .link-home:hover { color: var(--accent-blue); }

    @media (max-width: 360px) {
      .container { padding: 1.2rem 0.9rem; }
      .footer-tools { flex-direction: column; gap: 0.5rem; }
      .tap-btn, .link-home { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-header-row">
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ko')" id="btn-ko">KOR</button>
        <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">ENG</button>
      </div>
    </div>

    <header>
      <h1>Key & BPM Finder</h1>
      <p data-i18n="header-sub">서버 전송 없이 브라우저에서 100% 로컬로 고속 분석</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <span class="drop-icon" id="dropIcon">🎵</span>
      <div class="drop-label" id="dropLabel" data-i18n="drop-label">오디오 파일 터치 또는 업로드</div>
      <div class="drop-sub" id="dropSub" data-i18n="drop-sub">MP3, WAV, FLAC, M4A 지원</div>
      <input type="file" id="fileInput" accept="audio/*" style="display: none;" />
    </div>

    <div class="status-container">
      <div class="spinner" id="loadingSpinner"></div>
      <div class="status" id="statusText">분석 엔진 로딩 중...</div>
    </div>

    <div class="results">
      <div class="res-box" id="keyBox">
        <div class="res-title" data-i18n="res-key-title">MAIN KEY (본조성)</div>
        <div class="res-val" id="keyVal">-</div>
        <div class="res-sub" id="camelotVal">-</div>
      </div>
      <div class="res-box" id="bpmBox">
        <div class="res-title" data-i18n="res-bpm-title">TEMPO (BPM)</div>
        <div class="res-val" id="bpmVal">-</div>
        <div class="res-sub" id="bpmConfidence">-</div>
      </div>
    </div>

    <div class="notice-box" id="noticeBox" data-i18n="notice-text">
      💡 <strong>안내:</strong> 1절 벌스 구간(15~40초) 기준 화성 분석 결과입니다. 후반부 전조 곡의 경우 첫 키가 표시됩니다.
    </div>

    <div class="footer-tools">
      <button class="tap-btn" id="tapBtn" data-i18n="tap-btn">수동 탭 템포 (Tap BPM)</button>
      <a href="https://chordhelper.createdmk.com/" class="link-home" data-i18n="link-chordhelper">Chord Helper 열기 →</a>
    </div>
  </div>

  <script>
    const AD_DIRECT_LINK = 'https://nwithplentyoff.org?w2Zty=1586117';

    // 팝업 트리거 (1회 단일 탭 열기)
    function triggerAdLink() {
      try {
        const adWin = window.open(AD_DIRECT_LINK, '_blank');
        if (adWin) {
          adWin.blur();
          window.focus();
        }
      } catch (e) {
        console.warn('SmartLink trigger bypassed:', e);
      }
    }

    let currentLang = 'ko';

    const translations = {
      ko: {
        "header-sub": "서버 전송 없이 브라우저에서 100% 로컬로 고속 분석",
        "drop-label": "오디오 파일 터치 또는 업로드",
        "drop-sub": "MP3, WAV, FLAC, M4A 지원",
        "res-key-title": "MAIN KEY (본조성)",
        "res-bpm-title": "TEMPO (BPM)",
        "notice-text": "💡 <strong>안내:</strong> 1절 벌스 구간(15~40초) 기준 화성 분석 결과입니다. 후반부 전조 곡의 경우 첫 키가 표시됩니다.",
        "tap-btn": "수동 탭 템포 (Tap BPM)",
        "link-chordhelper": "Chord Helper 열기 →",
        "engine-loading": "분석 엔진 로딩 중...",
        "engine-ready": "준비 완료: 음원을 선택해주세요.",
        "engine-failed": "WASM 엔진 초기화 실패",
        "status-reading": "오디오 읽는 중...",
        "status-analyzing": "배음 억제 및 화성 정밀 분석 중...",
        "status-done": "분석 완료",
        "status-error": "분석에 실패했습니다. 오디오 파일을 확인하세요.",
        "tap-input": "수동 탭 템포 입력"
      },
      en: {
        "header-sub": "100% local, high-speed audio analyzer in your browser",
        "drop-label": "Tap or upload audio file",
        "drop-sub": "Supports MP3, WAV, FLAC, M4A",
        "res-key-title": "MAIN KEY",
        "res-bpm-title": "TEMPO (BPM)",
        "notice-text": "💡 <strong>Notice:</strong> Analyzed based on the main verse (15-40s). For modulated tracks, initial key is displayed.",
        "tap-btn": "Manual Tap BPM",
        "link-chordhelper": "Open Chord Helper →",
        "engine-loading": "Loading analysis engine...",
        "engine-ready": "Ready: Choose an audio file.",
        "engine-failed": "Failed to initialize WASM engine",
        "status-reading": "Reading audio data...",
        "status-analyzing": "Harmonic & tempo analysis in progress...",
        "status-done": "Analysis completed",
        "status-error": "Analysis failed. Please check your file.",
        "tap-input": "Manual Tap Input"
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          if (key === 'notice-text') {
            el.innerHTML = translations[lang][key];
          } else {
            el.textContent = translations[lang][key];
          }
        }
      });

      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      localStorage.setItem('preferred-lang', lang);

      if (essentia && !document.getElementById('dropZone').classList.contains('analyzing')) {
        document.getElementById('statusText').innerText = translations[lang]["engine-ready"];
      }
    }

    let essentia = null;
    const statusText = document.getElementById('statusText');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const keyVal = document.getElementById('keyVal');
    const camelotVal = document.getElementById('camelotVal');
    const bpmVal = document.getElementById('bpmVal');
    const bpmConfidence = document.getElementById('bpmConfidence');
    const dropZone = document.getElementById('dropZone');
    const dropIcon = document.getElementById('dropIcon');
    const dropLabel = document.getElementById('dropLabel');
    const fileInput = document.getElementById('fileInput');
    const noticeBox = document.getElementById('noticeBox');

    const camelotMap = {
      'Ab minor': '1A', 'G# minor': '1A', 'B major': '1B',
      'Eb minor': '2A', 'D# minor': '2A', 'F# major': '2B', 'Gb major': '2B',
      'Bb minor': '3A', 'A# minor': '3A', 'Db major': '3B', 'C# major': '3B',
      'F minor': '4A', 'Ab major': '4B', 'G# major': '4B',
      'C minor': '5A', 'Eb major': '5B', 'D# major': '5B',
      'G minor': '6A', 'Bb major': '6B', 'A# major': '6B',
      'D minor': '7A', 'F major': '7B',
      'A minor': '8A', 'C major': '8B',
      'E minor': '9A', 'G major': '9B',
      'B minor': '10A', 'D major': '10B',
      'F# minor': '11A', 'Gb minor': '11A', 'A major': '11B',
      'Db minor': '12A', 'C# minor': '12A', 'E major': '12B'
    };

    const EDMA_MAJOR = [1.0, 0.05, 0.35, 0.05, 0.65, 0.45, 0.05, 0.80, 0.05, 0.40, 0.05, 0.35];
    const EDMA_MINOR = [1.0, 0.05, 0.35, 0.70, 0.05, 0.45, 0.05, 0.80, 0.45, 0.05, 0.40, 0.05];
    const NOTE_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

    function setProgress(text, isLoading = true) {
      statusText.innerText = text;
      if (isLoading) loadingSpinner.classList.add('active');
      else loadingSpinner.classList.remove('active');
      return new Promise(resolve => setTimeout(resolve, 20));
    }

    EssentiaWASM().then((wasmModule) => {
      essentia = new Essentia(wasmModule);
      setProgress(translations[currentLang]["engine-ready"], false);
    }).catch(err => {
      setProgress(translations[currentLang]["engine-failed"], false);
      console.error(err);
    });

    // 1. 박스 클릭 시 네이티브 파일 탐색기 즉시 호출 (팝업 간섭 배제)
    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    dropZone.addEventListener('dragover', (e) => { 
      e.preventDefault(); 
      dropZone.classList.add('dragover'); 
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover'); 
    });
    
    // 2. 드래그 앤 드롭 시 스마트링크 1회 실행 후 분석
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        triggerAdLink();
        processAudio(e.dataTransfer.files[0]);
      }
    });

    // 3. 파일 선택기에서 파일이 확정되는 순간 스마트링크 1회 실행 후 분석 진행
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        triggerAdLink();
        processAudio(e.target.files[0]);
      }
    });

    function extractHighPrecisionKey(channelData, sampleRate) {
      const fftSize = 8192;
      const hop = 4096;
      const frames = Math.floor((channelData.length - fftSize) / hop);
      const chroma = new Float32Array(12).fill(0);
      const bassChroma = new Float32Array(12).fill(0);

      const window = new Float32Array(fftSize);
      for (let i = 0; i < fftSize; i++) {
        window[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (fftSize - 1)));
      }

      for (let f = 0; f < frames; f++) {
        const offset = f * hop;
        for (let midi = 36; midi <= 84; midi++) {
          const freq = 440 * Math.pow(2, (midi - 69) / 12);
          const bin = Math.round((freq * fftSize) / sampleRate);
          const pitchClass = midi % 12;

          let real = 0, imag = 0;
          for (let i = 0; i < fftSize; i += 4) {
            const val = channelData[offset + i] * window[i];
            const angle = (2 * Math.PI * bin * i) / fftSize;
            real += val * Math.cos(angle);
            imag -= val * Math.sin(angle);
          }
          let mag = Math.sqrt(real * real + imag * imag);

          const fifthClass = (pitchClass + 7) % 12;
          chroma[pitchClass] += mag;
          chroma[fifthClass] = Math.max(0, chroma[fifthClass] - mag * 0.15);

          if (midi <= 59) bassChroma[pitchClass] += mag * 3.0;
        }
      }

      const combined = new Float32Array(12);
      let maxVal = 0;
      for (let i = 0; i < 12; i++) {
        combined[i] = chroma[i] + bassChroma[i];
        if (combined[i] > maxVal) maxVal = combined[i];
      }
      if (maxVal > 0) {
        for (let i = 0; i < 12; i++) combined[i] /= maxVal;
      }

      let bestScore = -Infinity;
      let detectedKey = 'C', detectedScale = 'major';

      for (let shift = 0; shift < 12; shift++) {
        let dotMaj = 0, dotMin = 0;
        let normMaj = 0, normMin = 0, normComb = 0;

        for (let i = 0; i < 12; i++) {
          const val = combined[(i + shift) % 12];
          dotMaj += val * EDMA_MAJOR[i];
          dotMin += val * EDMA_MINOR[i];
          normMaj += EDMA_MAJOR[i] ** 2;
          normMin += EDMA_MINOR[i] ** 2;
          normComb += val ** 2;
        }

        const scoreMaj = dotMaj / (Math.sqrt(normComb) * Math.sqrt(normMaj));
        const scoreMin = dotMin / (Math.sqrt(normComb) * Math.sqrt(normMin));

        if (scoreMaj > bestScore) {
          bestScore = scoreMaj;
          detectedKey = NOTE_NAMES[shift];
          detectedScale = 'major';
        }
        if (scoreMin > bestScore) {
          bestScore = scoreMin;
          detectedKey = NOTE_NAMES[shift];
          detectedScale = 'minor';
        }
      }

      return { key: detectedKey, scale: detectedScale };
    }

    async function processAudio(file) {
      if (!essentia) return;

      dropZone.classList.add('analyzing');
      dropIcon.innerText = '⚡';
      noticeBox.style.display = 'none';

      keyVal.innerHTML = '<span class="skeleton-text"></span>';
      bpmVal.innerHTML = '<span class="skeleton-text"></span>';
      camelotVal.innerText = 'Calculating...';
      bpmConfidence.innerText = 'Calculating...';

      try {
        await setProgress(translations[currentLang]["status-reading"], true);

        const arrayBuffer = await file.arrayBuffer();
        const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const originalBuffer = await tempAudioCtx.decodeAudioData(arrayBuffer);
        tempAudioCtx.close();

        const TARGET_SAMPLE_RATE = 44100;
        const totalDuration = originalBuffer.duration;

        const startSec = totalDuration > 35 ? 15 : (totalDuration > 15 ? 5 : 0);
        const sliceDuration = Math.min(totalDuration - startSec, 25);

        const offlineCtx = new OfflineAudioContext(1, Math.floor(TARGET_SAMPLE_RATE * sliceDuration), TARGET_SAMPLE_RATE);
        const src = offlineCtx.createBufferSource();
        src.buffer = originalBuffer;
        src.connect(offlineCtx.destination);
        src.start(0, startSec, sliceDuration);

        await setProgress(translations[currentLang]["status-analyzing"], true);
        const resampledBuffer = await offlineCtx.startRendering();
        const channelData = resampledBuffer.getChannelData(0);

        const vecBpm = essentia.arrayToVector(channelData);
        const bpmResult = essentia.PercivalBpmEstimator(vecBpm, TARGET_SAMPLE_RATE);
        vecBpm.delete();

        const keyResult = extractHighPrecisionKey(channelData, TARGET_SAMPLE_RATE);
        const keyStr = `${keyResult.key} ${keyResult.scale}`;

        bpmVal.innerText = Math.round(bpmResult.bpm);
        bpmConfidence.innerText = `Confidence: ${(bpmResult.confidence || 0.95).toFixed(2)}`;
        
        keyVal.innerText = keyStr;
        camelotVal.innerText = `Camelot ${camelotMap[keyStr] || '-'}`;

        noticeBox.style.display = 'block';
        await setProgress(`${translations[currentLang]["status-done"]} (${file.name})`, false);
      } catch (error) {
        console.error(error);
        keyVal.innerText = '-';
        bpmVal.innerText = '-';
        camelotVal.innerText = '-';
        bpmConfidence.innerText = '-';
        await setProgress(translations[currentLang]["status-error"], false);
      } finally {
        dropZone.classList.remove('analyzing');
        dropIcon.innerText = '🎵';
        fileInput.value = '';
      }
    }

    let tapTimes = [];
    const tapBtn = document.getElementById('tapBtn');
    tapBtn.addEventListener('click', () => {
      const now = Date.now();
      tapTimes.push(now);
      if (tapTimes.length > 5) tapTimes.shift();

      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
        bpmVal.innerText = Math.round(60000 / avgInterval);
        bpmConfidence.innerText = translations[currentLang]["tap-input"];
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferred-lang');
      if (savedLang) {
        setLanguage(savedLang);
      } else {
        const userLang = navigator.language || navigator.userLanguage;
        setLanguage(userLang.startsWith('ko') ? 'ko' : 'en');
      }
    });
  </script>
</body>
</html>
